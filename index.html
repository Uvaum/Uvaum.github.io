<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0817" />
    <script>
      // Apply the saved theme before first paint to avoid a flash; dark is the default.
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('link[rel="icon"]').href = '/favicon-light.svg'
        } else {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
      // Recruiter mode (clean summary, no game layer): ?mode=recruiter in the link, or remembered.
      try {
        var q = new URLSearchParams(location.search).get('mode')
        if (q === 'recruiter' || (q !== 'game' && localStorage.getItem('mode') === 'recruiter'))
          document.documentElement.dataset.mode = 'recruiter'
      } catch (e) {}
    </script>
    <meta name="description" content="Rhuan Oliveira, desenvolvedor Full Stack: Python, Django, React e AWS." />
    <meta property="og:title" content="Rhuan Oliveira | Full Stack Developer" />
    <meta property="og:description" content="APIs em Python e Django, interfaces em React e infraestrutura na AWS." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://uvaum.github.io/" />
    <meta property="og:image" content="https://uvaum.github.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://uvaum.github.io/og.png" />
    <link rel="preconnect" href="https://api.github.com" crossorigin />
    <!-- Self-hosted pixel fonts (latin subset only, ~30 KB total), preloaded so text paints early. -->
    <link rel="preload" href="/fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/vt323.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Press Start 2P';
        font-display: swap;
        src: url(/fonts/press-start-2p.woff2) format('woff2');
      }
      @font-face {
        font-family: 'VT323';
        font-display: swap;
        src: url(/fonts/vt323.woff2) format('woff2');
      }
    </style>
    <title>Rhuan Oliveira | Full Stack Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
